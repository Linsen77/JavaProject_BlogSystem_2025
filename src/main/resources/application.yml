blog:
  avatar:
    upload-dir: ${BLOG_AVATAR_UPLOAD_DIR:./data/avatars}
server:
  servlet:
    session:
      cookie:
        same-site: None
        secure: true
spring:
  datasource:
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  mail:
    host: ${BLOG_SMTP_HOST:localhost}
    port: ${BLOG_SMTP_PORT:465}
    username: ${BLOG_SMTP_USERNAME:}
    password: ${BLOG_SMTP_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        debug: false
  jpa:
    hibernate:
      ddl-auto: ${BLOG_DDL_AUTO:validate}
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:./uploads/
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
